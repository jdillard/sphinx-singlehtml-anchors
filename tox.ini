[tox]
requires = tox>=4.20
env_list =
    lint
    docs
    docs-without
    sphinx81
    sphinx82
    sphinx91
    sphinx-revert

[testenv]
description = run extension regression tests
package = wheel
commands = pytest {posargs}

[testenv:sphinx81]
description = test the pre-8.2 active fix_refuris behavior
deps =
    pytest>=8
    Sphinx==8.1.3

[testenv:sphinx82]
description = test the first release without active fix_refuris calls
deps =
    pytest>=8
    Sphinx==8.2.3

[testenv:sphinx91]
description = test the current Sphinx 9 release line
deps =
    pytest>=8
    Sphinx==9.1.0

[testenv:sphinx-revert]
description = test the fix_refuris restoration proposed by sphinx-doc/sphinx#14241
deps =
    pytest>=8
    Sphinx @ git+https://github.com/sphinx-doc/sphinx.git@refs/pull/14241/head

[testenv:lint]
description = run static checks
skip_install = true
deps =
    mypy>=1.11
    ruff>=0.8
    Sphinx==8.1.3
    types-docutils
commands =
    ruff check .
    ruff format --check .
    mypy --strict src/sphinx_singlehtml_anchors

[testenv:docs{,-without}]
description =
    docs: build the live documentation with document-qualified anchors
    docs-without: build the comparison documentation without the extension
extras = docs
set_env =
    docs-without: SINGLEHTML_ANCHORS_DEMO = 0
commands =
    python -m sphinx -W --keep-going -b singlehtml \
        -d {envtmpdir}/doctrees docs {envtmpdir}/html
