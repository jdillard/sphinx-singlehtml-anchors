version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # Publish the fixed demonstration and an unmodified Sphinx comparison.
    build:
      html:
        - python -m sphinx -W --keep-going -b singlehtml -d _build/doctrees-with docs $READTHEDOCS_OUTPUT/html
        - env SINGLEHTML_ANCHORS_DEMO=0 python -m sphinx -W --keep-going -b singlehtml -d _build/doctrees-without docs $READTHEDOCS_OUTPUT/html/without-extension

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
